name: Release

# Tags are the trigger: pushing 0.0.1 (or v0.0.1) builds the macOS archive and
# publishes it. The version in the tag has to match manifest.json, which the
# packaging script checks before it writes anything.
on:
  push:
    tags: ["*.*.*"]

permissions:
  contents: write

jobs:
  macos:
    # macOS because the archive is built with ditto, and because the plugin
    # runs nowhere else. One runner covers both architectures: node-pty
    # publishes Apple Silicon and Intel prebuilds in the same package, so
    # whichever machine GitHub hands out produces the same archive.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The body lists the commits since the previous tag, which needs more
          # history than the single commit a default checkout fetches.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build

      - name: Package the plugin folder
        env:
          TAG: ${{ github.ref_name }}
        run: npm run package -- --tag "$TAG"

      # What changed since the previous tag, so no two releases carry the same
      # notes. Taken from the commits rather than from GitHub's own generator,
      # which lists merged pull requests: this repository is committed to
      # directly, so the generator would have nothing to say.
      - name: Build the release body
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          previous=$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || true)
          if [ -n "$previous" ]; then
            {
              printf '## Changes since %s\n\n' "$previous"
              git log --reverse --pretty='- %s' "$previous..$TAG"
              printf '\nFull changelog: https://github.com/%s/compare/%s...%s\n' \
                "$REPO" "$previous" "$TAG"
            } > body.md
          else
            printf 'First release.\n' > body.md
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.zip \
            --title "$TAG" \
            --notes-file body.md \
            --verify-tag
